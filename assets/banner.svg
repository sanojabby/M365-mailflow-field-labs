<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Microsoft 365 &amp; Exchange Online Troubleshooting Labs</title>
  <desc id="bannerDesc">Ten mail flow cases, with message traces, transport rule priorities and the evidence that each fix held.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152740"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#panel)"/>
  <rect x="0" y="0" width="9" height="340" fill="#38bdf8"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="100" font-size="17" font-weight="600" letter-spacing="2.8" fill="#7dd3fc">EXCHANGE ONLINE &#183; MESSAGE TRACE &#183; TRANSPORT RULES</text>
    <text x="70" y="172" font-size="48" font-weight="700" fill="#f8fafc">Microsoft 365 &amp; Exchange Online</text>
    <text x="70" y="236" font-size="48" font-weight="700" fill="#f8fafc">Troubleshooting Labs</text>
    <text x="72" y="298" font-size="21" fill="#8fa6c0">Ten cases: forwarding, transport rules, authentication and hybrid routing</text>
  </g>

  <g fill="#17293f" stroke="#24405c" stroke-width="1.5">
    <rect x="968" y="150" width="240" height="32" rx="9"/>
    <rect x="968" y="196" width="240" height="32" rx="9"/>
    <rect x="968" y="242" width="240" height="32" rx="9"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="988" cy="166" r="5.5"/>
    <circle cx="988" cy="212" r="5.5" opacity="0.65"/>
    <circle cx="988" cy="258" r="5.5" opacity="0.4"/>
  </g>
  <g fill="#3d5f84">
    <rect x="1008" y="163" width="140" height="6" rx="3"/>
    <rect x="1008" y="209" width="164" height="6" rx="3"/>
    <rect x="1008" y="255" width="118" height="6" rx="3"/>
  </g>
